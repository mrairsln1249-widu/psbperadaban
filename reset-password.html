<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — PSB Pesantren Peradaban</title>
  <link rel="icon" type="image/jpeg" href="faviconpp.jpg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="portal-page">
  <main class="auth-shell">
    <a class="portal-brand" href="index.html"><img src="logopp.png" alt="Logo Pesantren Peradaban"><span>Portal PSB</span></a>
    <section class="auth-card">
      <h1>Atur Password Baru</h1>
      <p>Gunakan password baru minimal 6 karakter untuk akun pendaftaran Anda.</p>
      <form id="resetPasswordForm" novalidate>
        <label>Password baru<input id="newPassword" type="password" minlength="6" autocomplete="new-password" required></label>
        <label>Ulangi password baru<input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required></label>
        <button class="btn btn--primary btn--block" type="submit" id="resetPasswordSubmit">Simpan Password Baru</button>
      </form>
      <p class="portal-status" id="resetPasswordStatus" role="status"></p>
      <a class="portal-back" href="auth.html">Kembali ke halaman login</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="reset-password.js"></script>
</body>
</html>
